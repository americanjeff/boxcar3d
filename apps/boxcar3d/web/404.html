<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>404 - Page Not Found - Boxcar3d</title>
	<meta name="viewport" content="width=device-width">
	<meta name="color-scheme" content="dark light">
	<style>
		:root {
			--bg: #1a1a2e; --fg: #b8c2d8; --accent: #8be9fd; --muted: #6b7694;
		}
		@media (prefers-color-scheme: light) {
			:root { --bg: #f4f5f8; --fg: #2b3040; --accent: #0e7490; --muted: #5c6675; }
		}
		body {
			margin: 0; background-color: var(--bg); color: var(--fg);
			font-family: "SF Mono", Consolas, monospace;
			font-size: 0.95rem; line-height: 1.55;
			display: flex; align-items: center; justify-content: center;
			min-height: 100vh;
		}
		.page { padding: 24px; text-align: center; }
		h1 { color: var(--accent); font-size: 1.5rem; margin: 0 0 8px; }
		p { color: var(--muted); margin: 0 0 24px; }
		a { color: var(--accent); text-decoration: none; }
	</style>
</head>
<body>
	<div class="page">
		<h1>404 - not found</h1>
		<p>This page does not exist.</p>
		<a href="/">&larr; back to Boxcar3d</a>
	</div>
</body>
</html>
